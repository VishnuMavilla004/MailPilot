<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MailPilot{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F4F6F9; --surface: #FFFFFF; --ink: #14213D; --muted: #566275;
      --line: #DCE1E9; --blue: #2455C3; --red: #C62F2F; --amber: #B7791F;
      --slate: #6B7A90; --violet: #7B4A9E;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink);
           font: 16px/1.55 "Public Sans", system-ui, sans-serif; }
    h1, h2, h3, .brand { font-family: "Bricolage Grotesque", "Public Sans", system-ui, sans-serif;
                         line-height: 1.2; margin: 0; }
    h1 { font-size: 2rem; font-weight: 700; }
    h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 10px; }
    a { color: var(--blue); }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

    /* Airmail stripe */
    .stripe { height: 8px; background: repeating-linear-gradient(135deg,
      var(--red) 0 14px, #fff 14px 22px, var(--blue) 22px 36px, #fff 36px 44px); }

    /* Layout */
    .shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 8px); }
    .side { background: var(--surface); border-right: 1px solid var(--line);
            display: flex; flex-direction: column; padding-bottom: 24px; }
    .brand { font-weight: 700; font-size: 1.4rem; padding: 20px 20px 12px;
             text-decoration: none; color: var(--ink); }
    .side nav a { display: block; padding: 10px 20px; color: var(--ink); text-decoration: none;
                  border-left: 3px solid transparent; }
    .side nav a:hover { background: #F1F4F9; }
    .side nav a[aria-current="page"] { border-left-color: var(--blue); background: #EEF2FB; font-weight: 600; }
    .who { margin-top: auto; padding: 0 20px; font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
    .who form { margin-top: 6px; }
    main { padding: 32px clamp(16px, 4vw, 48px) 64px; max-width: 1040px; width: 100%; }
    .page-head { display: flex; justify-content: space-between; align-items: center;
                 gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .actions, .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btns { margin-top: 12px; }

    /* Buttons */
    .btn { font: inherit; font-weight: 600; background: var(--blue); color: #fff;
           border: 1px solid var(--blue); border-radius: 6px; padding: 8px 14px;
           cursor: pointer; text-decoration: none; display: inline-block; }
    .btn:hover { background: #1B44A0; }
    .btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); }
    .btn.quiet:hover { background: #EEF2F8; }
    .btn.danger { background: transparent; color: var(--red); border-color: transparent; }
    .btn.danger:hover { background: #FBEDED; }
    .link { font: inherit; background: none; border: 0; color: var(--blue);
            cursor: pointer; padding: 0; text-decoration: underline; }

    /* Messages */
    .msg { padding: 10px 14px; border-left: 4px solid var(--slate); background: var(--surface); margin-bottom: 16px; }
    .msg.success { border-color: #2E7D4F; } .msg.error { border-color: var(--red); }
    .msg.warning { border-color: var(--amber); } .msg.info { border-color: var(--blue); }

    /* Categories: one color per category, used for tabs, chips and bars */
    [data-cat] { --c: #A0AAB8; }
    [data-cat="urgent"] { --c: var(--red); }
    [data-cat="meeting"] { --c: var(--blue); }
    [data-cat="needs_reply"] { --c: var(--amber); }
    [data-cat="newsletter"] { --c: var(--slate); }
    [data-cat="spam"] { --c: var(--violet); }
    .chip { display: inline-flex; align-items: center; font-size: .85rem; font-weight: 600; }
    .chip::before { content: ""; width: .65em; height: .65em; border-radius: 50%;
                    background: var(--c); margin-right: .45em; }
    .conf { color: var(--muted); font-size: .85rem; margin-left: 8px; }

    /* Inbox list */
    .mail-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .mail { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px;
            padding: 14px 16px; background: var(--surface); color: inherit; text-decoration: none;
            border-left: 4px solid var(--c); border-bottom: 1px solid var(--line); }
    a.mail:hover { background: #F8FAFD; }
    .mail .from { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mail .when { color: var(--muted); font-size: .85rem; text-align: right; }
    .mail .subject { grid-column: 1 / -1; }
    .mail .snippet { grid-column: 1 / -1; color: var(--muted); font-size: .9rem;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mail .meta { grid-column: 1 / -1; margin-top: 6px; }
    .empty { padding: 24px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--line); }

    /* Email page */
    .back { display: inline-block; margin-bottom: 12px; }
    .detail { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 40px; align-items: start; }
    .msg-meta { color: var(--muted); font-size: .9rem; margin: 8px 0 20px; }
    .body { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 70ch;
            background: var(--surface); border: 1px solid var(--line); padding: 16px; }
    .panel section { padding: 20px 0; border-top: 1px solid var(--line); }
    .panel section:first-child { border-top: 0; padding-top: 0; }
    label.field { display: block; font-weight: 500; font-size: .9rem; margin: 10px 0 4px; }
    input[type=text], input[type=datetime-local], textarea {
      width: 100%; font: inherit; padding: 8px 10px; border: 1px solid #B9C2CF;
      border-radius: 6px; background: #fff; color: var(--ink); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .check { display: flex; gap: 8px; align-items: center; margin: 12px 0 0; }
    .draft { margin-top: 20px; }
    .tag { font-size: .85rem; color: var(--muted); margin: 0 0 6px; }
    .plain { list-style: none; padding: 0; margin: 0; }
    .plain li { padding: 8px 0; border-bottom: 1px solid var(--line); }

    /* Dashboard */
    .facts { display: flex; gap: 32px; flex-wrap: wrap; margin: 16px 0 28px; }
    .facts strong { display: block; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 1.6rem; }
    .facts span { color: var(--muted); font-size: .9rem; }
    .bar { display: flex; height: 22px; background: #E6EAF0; border-radius: 4px; overflow: hidden; margin: 8px 0 12px; }
    .bar span { background: var(--c); height: 100%; }
    .legend { list-style: none; margin: 0 0 28px; padding: 0; max-width: 420px; }
    .legend li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    .note { color: var(--muted); font-size: .9rem; }

    /* Home */
    .hero { max-width: 640px; padding: 40px 0 8px; }
    .lead { font-size: 1.15rem; color: var(--muted); max-width: 56ch; }
    .sample { margin-top: 40px; max-width: 560px; }

    @media (max-width: 760px) {
      .shell { grid-template-columns: 1fr; }
      .side { flex-direction: row; flex-wrap: wrap; align-items: center; padding: 0 8px; }
      .side nav { display: flex; }
      .who { margin: 0 0 0 auto; padding: 0 12px; }
      .detail, .two, .row2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="stripe"></div>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="{% url 'home' %}">MailPilot</a>
      {% if user.is_authenticated %}
        <nav>
          <a href="{% url 'inbox' %}" {% if request.resolver_match.url_name == 'inbox' %}aria-current="page"{% endif %}>Inbox</a>
          <a href="{% url 'dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
        </nav>
        <div class="who">
          {{ user.email }}
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="link" type="submit">Sign out</button>
          </form>
        </div>
      {% endif %}
    </aside>
    <main>
      {% for message in messages %}
        <div class="msg {{ message.tags }}" role="status">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
